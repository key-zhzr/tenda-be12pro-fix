name: Build BE12 Pro AN8855 RFT

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: ImmortalWrt source ref (commit, tag, or branch)
        required: true
        default: 45474b1733debddfde8ce98ff2529b24cf9756ea
      variant:
        description: Patch variant (multiwan includes persistent dual-stack identities)
        required: true
        default: multiwan
        type: choice
        options:
          - multiwan
          - multiwan-mdio-debug
          - vendorfix
          - vendorfix-noeee
          - vendorfix-mdio-debug

permissions:
  contents: read

concurrency:
  group: be12pro-an8855-rft-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: ${{ github.workspace }}/source/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: "3G"
      PATCHSET: ${{ inputs.variant }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Checkout control files
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout official ImmortalWrt
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          path: source

      - name: Apply and verify patches
        working-directory: source
        run: bash ../control/scripts/prepare-source.sh "$PWD" "$PATCHSET"

      - name: Initialize build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-pyelftools python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ccache libelf-dev time patch \
            perl ca-certificates gcc-multilib g++-multilib zstd bzip2 xz-utils \
            gperf help2man pkgconf cmake autoconf automake libtool autopoint \
            device-tree-compiler python3-ply python3-docutils libgmp-dev libmpc-dev libmpfr-dev
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: source/dl
          key: immortalwrt-be12pro-dl-${{ runner.os }}-${{ inputs.source_ref }}
          restore-keys: |
            immortalwrt-be12pro-dl-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: source/.ccache
          key: immortalwrt-be12pro-ccache-${{ runner.os }}-${{ inputs.source_ref }}-${{ inputs.variant }}-${{ github.run_id }}
          restore-keys: |
            immortalwrt-be12pro-ccache-${{ runner.os }}-${{ inputs.source_ref }}-${{ inputs.variant }}-
            immortalwrt-be12pro-ccache-${{ runner.os }}-${{ inputs.source_ref }}-
            immortalwrt-be12pro-ccache-${{ runner.os }}-

      - name: Update and install feeds
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target and required packages
        working-directory: source
        run: bash ../control/scripts/configure-build.sh "$PWD"

      - name: Download sources
        working-directory: source
        run: |
          if ! make download -j"$(nproc)"; then
            echo '::warning::Download stage failed; retrying serially with V=s'
            make download -j1 V=s
          fi

      - name: Build firmware
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          ccache --zero-stats || true
          if ! make -j"$(nproc)"; then
            echo '::warning::Parallel build failed; retrying serially with V=s'
            make -j1 V=s
          fi
          ccache --show-stats || true

      - name: Collect images and build metadata
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          OUT=bin/targets/mediatek/filogic
          DEST="${GITHUB_WORKSPACE}/artifact"
          mkdir -p "$DEST"
          find "$OUT" -maxdepth 1 -type f \
            \( -name '*tenda_be12-pro*' -o -name 'profiles.json' \) -exec cp -v {} "$DEST/" \;
          find "$DEST" -maxdepth 1 -name '*initramfs*' | grep -q .
          find "$DEST" -maxdepth 1 -name '*sysupgrade*' | grep -q .
          cp .config "$DEST/build.config"
          ./scripts/diffconfig.sh > "$DEST/build.diffconfig"
          {
            printf 'source_ref=%s\nvariant=%s\n' "$SOURCE_REF" "$PATCHSET"
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'control_sha=%s\n' "$(git -C ../control rev-parse HEAD)"
            for feed in feeds/*; do
              [ -d "$feed/.git" ] || continue
              printf 'feed_%s=%s\n' "${feed##*/}" "$(git -C "$feed" rev-parse HEAD)"
            done
          } > "$DEST/BUILD_INFO.txt"
          cd "$DEST"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: be12pro-an8855-${{ inputs.variant }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
